# Docker dev environment (issue #2116).
#
# LOCAL DEVELOPMENT ONLY. See docs/development/ENVIRONMENT.md's "Docker Dev
# Environment" section. Per-checkout host ports:
#
#   checkout    site   phpMyAdmin   mock-brevo   landing page
#   Registry    8001   8081         8091         8101
#   Registry2   8002   8082         8090         8102   (the defaults below)
#   next        8003   8083         8092         8103
#
# Coexists with MAMP: MAMP keeps serving each checkout on 9999/8889
# unaffected. This stack runs in parallel on the ports below.
#
# Running this stack in another checkout? This file is shared by every
# checkout on the branch, so do NOT edit it per checkout. Set the host ports
# in that checkout's own (gitignored) .env instead; the defaults below are
# Registry2's:
#
#   CHECKOUT_NAME=Registry        # label on the landing page
#   APP_HOST_PORT=8001            # site           (Registry2: 8002)
#   PMA_HOST_PORT=8081            # phpMyAdmin     (Registry2: 8082)
#   MOCK_BREVO_HOST_PORT=8091     # mock-brevo UI  (Registry2: 8090)
#   LANDING_HOST_PORT=8101        # landing page   (Registry2: 8102)
#
# Two stacks with the same port fail loudly ("port is already allocated").
# The network and volume need no per-checkout change: Compose prefixes both
# with the project name (the checkout's directory), so Registry/ gets
# registry_elan and registry_db_data, separate from
# Registry2's. `APP_UID`/`APP_GID` below still need changing if the checkout
# is worked on by a different host user.
#
#   docker compose up -d
#   docker compose exec -u www-data app composer install
#   docker compose exec -u www-data app composer test:full
#   docker compose down        # keep DB volume
#   docker compose down -v     # wipe DB volume too
#
# ALWAYS pass `-u www-data` to `exec`. `docker compose exec` has no
# compose-file setting for its default user — it runs as the image's build
# default, which for this Dockerfile is root (see docker/Dockerfile's UID/GID
# comment: the request-serving Apache workers drop to www-data via
# apache2.conf, but a bare `exec` bypasses that entirely and gets root).
# Found via a leaked root-owned `php -S` process spawned by
# tests/integration/BrevoWebhookEndpointTest.php during `composer test:full`
# run without -u — harmless on this Mac (Docker Desktop's VirtioFS maps
# container writes back to the host user regardless of in-container UID) but
# would root-own bind-mounted files on a Linux host, defeating the whole
# UID-matching point of this image.

services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        APP_UID: "501"
        APP_GID: "20"
    restart: "no"
    # No env_file here deliberately: the app reads .env itself, at runtime,
    # via the bind mount (users/init.php + vlucas/phpdotenv) — same as it
    # always has. Injecting it a second time via Compose's env_file would
    # only add exposure (DB_PASS, TURNSTILE_SECRET_KEY, etc. become visible
    # in `docker inspect` / /proc/*/environ / phpinfo() Environment section)
    # for no benefit. The db service's ${DB_NAME}/${DB_USER}/${DB_PASS}
    # substitutions below come from Compose's own automatic discovery of a
    # .env file in the project directory — a separate mechanism that needs
    # no env_file directive. Found during senior-architect review.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8002}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [elan]

  db:
    image: mysql:8.0
    restart: "no"
    # Binary logging is on by default in the official image and blocks
    # CREATE TRIGGER (schema migrations use them for the car audit trail)
    # unless the connecting user has SUPER, or log_bin_trust_function_creators
    # is set — neither of which our app-scoped DB_USER has/can set. Not
    # needed for a single-node local dev DB with no replication, so it's
    # simplest to turn it off outright rather than grant SUPER to work
    # around it.
    #
    # default-time-zone: one historical migration
    # (20260905172137_convert_car_timestamps_to_datetime.php) hardcodes
    # 'America/Los_Angeles' as APPLICATION_TIMEZONE and refuses to run
    # unless MySQL's NOW() is within a few seconds of PHP time evaluated in
    # that zone — a one-time guard against corrupting production data that
    # was originally written under LA wall-clock time. The container's
    # default (UTC) fails that check even against a brand-new, empty
    # database, so `composer migrate`/`provision-schema.sh` cannot get past
    # this migration without it. Undocumented anywhere else in the repo —
    # found only by running provision-schema.sh from scratch.
    command: --disable-log-bin --default-time-zone=America/Los_Angeles
    environment:
      # :? fails fast with a clear message if .env is missing or incomplete,
      # instead of Compose silently substituting an empty string and MySQL's
      # entrypoint failing in a way that reads as a container problem rather
      # than a config one.
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME must be set in .env}
      MYSQL_USER: ${DB_USER:?DB_USER must be set in .env}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    # Not exposed on a host port: the app container reaches this service by
    # name (`db`) over the compose network. Nothing outside the stack needs
    # a direct connection — phpMyAdmin, below, is the intended DB-inspection
    # path, matching the issue's "no CLI mysql client required" goal.
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [elan]

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: "no"
    environment:
      PMA_HOST: db
    # Local-only bind, per the issue's explicit access-control requirement:
    # phpMyAdmin must not be reachable outside localhost, and is never
    # routed through Traefik.
    ports:
      - "127.0.0.1:${PMA_HOST_PORT:-8082}:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [elan]

  mock-brevo:
    # Local stand-in for the real Brevo transactional email API (#2127,
    # investigated in #2118). Reachable from the `app` container as
    # http://mock-brevo:8080/v3 over the elan network, and from the
    # host at http://localhost:$MOCK_BREVO_HOST_PORT (its web inbox) for
    # manual inspection. No depends_on/healthcheck: the app only talks to
    # it when sendinblue() actually sends, not at container boot. Its host
    # port follows the per-checkout table in the header.
    image: ghcr.io/c0boleis/mock-brevo:1.0.0
    restart: "no"
    environment:
      MOCK_BREVO_DB_PATH: /app/data/brevo
    ports:
      - "127.0.0.1:${MOCK_BREVO_HOST_PORT:-8090}:8080"
    networks: [elan]

  landing:
    # Local index page linking this checkout's site, phpMyAdmin and the
    # mock-brevo inbox. The HTML is rendered once at startup from
    # docker/landing/index.html.template, substituting the same host-port
    # variables the services above publish on, so the links always match
    # this checkout's ports. The link targets are the host's published ports,
    # so this needs no network access to the other services.
    image: nginx:1.27-alpine
    restart: "no"
    environment:
      CHECKOUT_NAME: ${CHECKOUT_NAME:-Registry2}
      APP_HOST_PORT: ${APP_HOST_PORT:-8002}
      PMA_HOST_PORT: ${PMA_HOST_PORT:-8082}
      MOCK_BREVO_HOST_PORT: ${MOCK_BREVO_HOST_PORT:-8090}
    volumes:
      - ./docker/landing/index.html.template:/landing/index.html.template:ro
    # envsubst is limited to the four names above so any other `$` in the
    # template is left alone. `$$` escapes `$` from Compose interpolation.
    command: >-
      sh -c "envsubst '$$CHECKOUT_NAME $$APP_HOST_PORT $$PMA_HOST_PORT $$MOCK_BREVO_HOST_PORT'
      < /landing/index.html.template > /usr/share/nginx/html/index.html
      && exec nginx -g 'daemon off;'"
    ports:
      - "127.0.0.1:${LANDING_HOST_PORT:-8102}:80"
    networks: [elan]

networks:
  elan:

volumes:
  db_data:
