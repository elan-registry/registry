; Dev-only PHP overrides for the Registry2 Docker app container (issue #2116).
;
; Copied to /usr/local/etc/php/conf.d/ by docker/Dockerfile. The official
; php:8.4-apache image ships NO php.ini at all (it provides php.ini-development
; and php.ini-production as unused samples), so every value here is set against
; PHP's compiled-in defaults rather than overriding a distro file.
;
; This file is for LOCAL DEVELOPMENT ONLY. display_errors and the verbose
; error_reporting below would leak stack traces and file paths in production.

; --- Error visibility -------------------------------------------------------
; Errors go to the browser AND the Apache error log (stderr -> docker logs),
; so a fatal is visible whether you are looking at the page or `docker compose
; logs -f app`. Without display_errors the php:apache image renders a blank
; white page on a fatal, which is the single biggest dev-time time sink.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
; Empty error_log routes to the SAPI logger (Apache), which the image already
; pipes to stderr. Do not point this at a file — it would land in the bind mount.
error_log =

; --- Limits -----------------------------------------------------------------
; 256M covers composer/PHPUnit runs inside the container and image resizing via
; GD (usersc/classes/Resize.php loads full bitmaps into memory).
memory_limit = 256M

; Car image uploads. CarImageProcessor::validateFileUpload() enforces a 5MB
; per-file limit in application code; these are deliberately set well above it
; so PHP is never the thing that rejects an upload — the app's own validation
; should be, with its proper error message. post_max_size must stay >=
; upload_max_filesize or PHP silently discards the whole POST body.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

; Long enough to debug with a breakpoint or run a slow migration through the
; web SAPI without a hard kill mid-request. CLI ignores this (defaults to 0).
max_execution_time = 120
max_input_time = 120

; --- Misc -------------------------------------------------------------------
; Container clock is UTC; pin explicitly so date() never emits a warning and
; timestamps are predictable across host/container. NOTE: this only governs
; code paths outside the app's normal request bootstrap — users/init.php
; unconditionally calls date_default_timezone_set('America/Los_Angeles') for
; every actual app request, overriding this ini value. This setting matters
; for CLI/tooling contexts that don't load users/init.php (composer scripts,
; ad-hoc php -r checks), not for the app itself.
date.timezone = UTC

; Opcache is enabled by default in the image but caches aggressively against a
; bind mount, where host edits can otherwise take up to 2s to appear. Revalidate
; every request: correctness over speed in dev.
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
