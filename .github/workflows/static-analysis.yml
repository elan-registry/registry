name: Static Analysis

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    paths:
      - "**.php"
      - "phpstan.neon"
      - "phpstan-baseline.neon"
      - "**.js"
      - "**.css"
      - "eslint.config.mjs"
  workflow_dispatch:

jobs:
  # PHPStan Analysis, PHP Coding Standards Check, and JavaScript Lint Check
  # are required status checks on main's branch protection. They used to be
  # gated by a `paths:` filter on the `pull_request` trigger itself — but a
  # workflow-level path filter means the workflow never runs at all when no
  # matching file changed, and a required check that never runs never posts
  # any status, so the PR blocks forever ("Expected — waiting for status to
  # be reported"). Reproduced on PR #1534, which only touched
  # .github/workflows/claude-code-review.yml.
  #
  # Fix: trigger unconditionally on pull_request, and gate each job with an
  # `if:` condition computed here instead. A job skipped via `if:` still
  # reports a "skipped" conclusion, which satisfies a required check —
  # unlike a workflow that never triggered, which reports nothing.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      php: ${{ steps.filter.outputs.php }}
      js: ${{ steps.filter.outputs.js }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            php:
              - "**.php"
              - "phpstan.neon"
              - "phpstan-baseline.neon"
              - "composer.json"
              - "composer.lock"
            js:
              - "**.js"
              - "eslint.config.mjs"
            docs:
              - "**.md"
              - "scripts/check-docs.php"

  docs:
    name: Documentation Consistency
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      # No composer install needed — the checker uses only PHP core.
      - name: Check documentation consistency
        run: php scripts/check-docs.php

  phpstan:
    name: PHPStan Analysis
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # PHPStan invalidates cache entries per-file by content hash, so a
      # cache restored from an older commit is still safe to reuse — it just
      # skips re-analyzing files that haven't changed since. A miss (new
      # cache key) costs nothing beyond a normal cold run.
      - name: Cache PHPStan result cache
        uses: actions/cache@v6
        with:
          path: .phpstan-cache
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Run PHPStan (full repo — level 5, baselined)
        run: vendor/bin/phpstan analyse --error-format=github --no-progress --memory-limit=512M

  coding-standards:
    name: PHP Coding Standards Check
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      # Only check PHP files changed in this PR (or push).
      # Uses a temp directory with changed files to work with the
      # directory-based coding standards checker.
      - name: Run coding standards checker on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            BASE="${{ github.event.before }}"
          fi

          CHANGED_PHP=$(git diff --name-only --diff-filter=ACMR "$BASE"..HEAD -- '*.php' || true)

          if [ -z "$CHANGED_PHP" ]; then
            echo "No PHP files changed — skipping."
            exit 0
          fi

          echo "Checking changed PHP files:"
          echo "$CHANGED_PHP"

          TMPDIR=$(mktemp -d)
          for f in $CHANGED_PHP; do
            mkdir -p "$TMPDIR/$(dirname "$f")"
            cp "$f" "$TMPDIR/$f"
          done

          php scripts/check-coding-standards.php "$TMPDIR"

  eslint:
    name: JavaScript Lint Check
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.js == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
