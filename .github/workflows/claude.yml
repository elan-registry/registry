# Calls the shared @claude workflow in unibrain1/devkit, pinned to the full
# commit SHA of a release tag (ADR-021). See
# https://github.com/unibrain1/devkit/blob/main/docs/ci-workflows.md
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: unibrain1/devkit/.github/workflows/claude.yml@871d2eaa25dfc8d1aa242ef6f1918487993b59bc # v1.2.0
    with:
      extra_allowed_tools: "Bash(php -l *),Bash(npm run lint)"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
