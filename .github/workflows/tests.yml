name: Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-regression:
    name: PHPUnit Unit + Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run unit tests
        # Excludes the 'known-broken' group: tests with a confirmed, tracked,
        # pre-existing failure (see the #[Group('known-broken')] tag + issue
        # comment on each affected test). `composer test:quick` (no exclusion)
        # remains the local/default command so developers still see these
        # failures — only the CI-blocking run skips them, and only until
        # their tracking issue is resolved. See tests/README.md's "CI vs.
        # Local Test Runs, and the known-broken Group" section for the
        # full convention.
        run: composer test:quick:ci

      - name: Run regression tests
        # Same 'known-broken' exclusion as the unit run above, for consistency
        # — a Regression test tagged known-broken must be excluded here too or
        # the escape hatch silently wouldn't apply to it.
        run: composer test:regression:ci

  hooks-changes:
    name: Detect git-hooks changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      hooks: ${{ steps.filter.outputs.hooks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            hooks:
              - ".githooks/**"
              - "tests/hooks/**"
              - "scripts/lib/**"
              - "scripts/*.sh"
              - ".claude/hooks/**"
              - ".github/workflows/tests.yml"
              - ".github/workflows/claude-code-review.yml"

  git-hooks:
    name: Git Hooks Regression Tests
    needs: hooks-changes
    # Same unconditional-trigger-plus-job-level-if pattern as
    # static-analysis.yml's `changes`-gated jobs (see that file's comment
    # on `changes`, PR #1534): a workflow-level path filter means the
    # workflow never runs at all when nothing matches, which is fine for a
    # non-required check like this one, but staying consistent with the
    # established pattern avoids re-litigating it later. Not a required
    # check, so this job simply runs on push to main unconditionally (no
    # `hooks-changes` job exists there) and is path-filtered on PRs only.
    if: always() && (github.event_name != 'pull_request' || needs.hooks-changes.outputs.hooks == 'true')
    runs-on: ubuntu-latest
    # `.githooks/pre-push`'s `_pick_closest_base()` has regressed three
    # times across separate reviews (#1751, #1767, #2029) with zero
    # automated coverage until this test was added (#2024) — this job is
    # what makes a fourth regression fail loudly in CI instead of only
    # being caught if a reviewer happens to hand-build synthetic git
    # topology again.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The test script builds synthetic commits/branches on top of
          # origin/main and real milestone/* branches — needs full history,
          # not the default shallow clone, for git merge-base/rev-list to
          # resolve correctly against them.
          fetch-depth: 0

      # Runs every tests/hooks/test-*.sh file, not a hand-picked subset, so a
      # new test file is covered the moment it lands — no separate step to
      # remember to add. Notes that still apply to specific tests in this
      # set:
      #   - test-pick-closest-base.sh: pins `.githooks/pre-push`'s
      #     `_pick_closest_base()`, regressed three times across separate
      #     reviews (#1751, #1767, #2029) with zero automated coverage until
      #     this test was added (#2024).
      #   - test-pre-push-gate.sh: covers the rest of the integration gate
      #     (#2160). Fully hermetic — builds its own throwaway repo under
      #     mktemp -d and never touches the checkout's refs.
      #   - test-provision-schema-guard.sh: pins the DB_HOST=db guard in
      #     scripts/provision-schema.sh. A host run can resolve `db` to
      #     another machine and DROP a database there.
      #   - test-render-deploy-sheet.sh: pins the #2225 fix — a match early
      #     in a >64 KB diff or file list must still be found. A piped
      #     `grep -q` under `pipefail` read it as no match. Also pins #2250:
      #     migration, trigger-migration, new-pages and admin-scripts flag
      #     only added files, and the base is origin/main when that ref
      #     exists.
      #   - test-phpstan-on-edit.sh: needs `vendor/bin/phpstan` for its
      #     "new error" assertion. This job installs no PHP toolchain (it
      #     would only serve this one assertion in this one test), so the
      #     hook it tests takes its own documented no-vendor fallback (exits
      #     0 without analysing) and the test reports that assertion as
      #     skipped rather than failed. Its other assertions (non-PHP file,
      #     upstream file, clean project file) still run and still gate.
      #   - test-check-known-broken-tests.sh: puts a stub `gh` first on PATH
      #     before any scenario runs, so its `gh issue view` calls never
      #     reach the real GitHub API. Hermetic — runs with no gh credentials
      #     and no outbound network access.
      #   - test-commit-push-pr.sh: clones this repo into a throwaway
      #     directory and repoints the clone's "origin" at a throwaway bare
      #     repo (not this checkout), with a stub `gh` first on PATH. Hermetic
      #     — a scenario that runs the script for real, including one that
      #     exercises a push, cannot reach this checkout or GitHub.
      - name: Run all git-hooks regression tests
        run: |
          fail=0
          for test_file in tests/hooks/test-*.sh; do
            echo "::group::$test_file"
            if bash "$test_file"; then
              echo "PASS: $test_file"
            else
              echo "FAIL: $test_file"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
