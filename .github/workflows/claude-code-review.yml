# Calls the shared Claude review in unibrain1/devkit, pinned to the full
# commit SHA of a release tag (ADR-021). See
# https://github.com/unibrain1/devkit/blob/main/docs/ci-workflows.md
#
# Edit this file only at a milestone boundary. A PR that edits it gets no
# Claude review, because claude-code-action skips a workflow file that
# differs from main (.claude/rules/ci-workflows.md).
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (optional)"
        type: number
        required: false
jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: unibrain1/devkit/.github/workflows/claude-review.yml@e4d784e7292b540c6488524badb2ab432cd44f32 # v0.1.1
    with:
      pr_number: ${{ inputs.pr_number }}
      extra_allowed_tools: "Bash(php -l *),Bash(npm run lint)"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
